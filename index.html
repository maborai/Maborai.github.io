<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maborai</title>
<link rel="stylesheet" href="style.css">
<script>
(function(){
  const saved = localStorage.getItem('theme');
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <img id="logo-img" src="logo-dark.png" alt="Maborai">
    <span class="brand-name">Maborai</span>
  </a>

  <div class="header-icons">
    <button class="icon-btn" id="search-toggle" title="جستجو" aria-label="جستجو">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
    </button>

    <button class="icon-btn" id="theme-toggle" title="تغییر تم" aria-label="تغییر تم">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
      </svg>
    </button>

    <!-- Menu button -->
    <div class="menu-wrapper">
      <button class="icon-btn" id="menu-toggle" title="منو" aria-label="منو" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <nav class="dropdown-menu hidden" id="dropdown-menu" role="menu">
        <a href="about.html" class="menu-item" role="menuitem">درباره</a>
        <a href="https://github.com/maborai/Maborai.github.io" target="_blank" rel="noopener" class="menu-item" role="menuitem">گیت‌هاب</a>
        <a href="https://blogix.ir/@maboroshi/chat" class="menu-item" role="menuitem">پشتیبانی</a>
        <div class="menu-sep"></div>
        <a href="privacy.html" class="menu-item" role="menuitem">حریم خصوصی</a>
        <a href="terms.html" class="menu-item" role="menuitem">شرایط استفاده</a>
      </nav>
    </div>
  </div>
</header>

<div class="search-bar hidden" id="search-bar">
  <input type="text" id="search-input" placeholder="جستجو در پست‌ها…" autocomplete="off">
  <input type="date" id="date-filter" title="فیلتر بر اساس تاریخ">
</div>

<main class="post-list" id="post-list"></main>

<p class="empty-state" id="empty-state" hidden>پستی پیدا نشد.</p>

<div class="pager" id="pager" hidden>
  <button id="prev-page" class="pager-btn">قبلی</button>
  <span id="page-label" class="pager-label"></span>
  <button id="next-page" class="pager-btn">بعدی</button>
</div>

<footer class="site-footer">
  <nav class="footer-links">
    <a href="about.html">درباره اینجا</a>
    <a href="https://blogix.ir/@maboroshi/chat">پشتیبانی</a>
    <a href="privacy.html">حریم خصوصی</a>
    <a href="terms.html">شرایط استفاده</a>
  </nav>
  <p>
    © 2026 کلیه حقوق این وب‌سایت متعلق به Maborai است.<br>
    این وبلاگ روی
    <a href="https://github.com/maborai/Maborai.github.io" target="_blank" rel="noopener">گیت‌هاب</a>
    هاست شده — هیچ اطلاعاتی از شما ذخیره نمی‌شه.
  </p>
</footer>

<script src="script.js"></script>
</body>
</html>
